[package]
name = "sophon-sdk"
version = "0.3.0"
edition.workspace = true
license.workspace = true
description = "Embeddable Rust SDK for the Grok Build agent runtime"
repository = "https://github.com/fran0220/sophon-sdk"
homepage = "https://github.com/fran0220/sophon-sdk"
documentation = "https://github.com/fran0220/sophon-sdk/tree/main/crates/sophon-sdk"
readme = "README.md"
keywords = ["agent", "desktop", "grok", "mcp", "sdk"]
categories = ["api-bindings", "development-tools"]
publish = false
autotests = false

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
fs2 = { workspace = true }
http = { workspace = true }
indexmap = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
rusqlite = { version = "0.37", features = ["bundled"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
url = { workspace = true }
uuid = { workspace = true }
xai-agent-lifecycle = { workspace = true }
xai-grok-mcp = { workspace = true }
xai-grok-shell = { workspace = true }

# Only used by `OsLivenessProbe`, which asks whether a recorded pid still names
# a live process. There is no portable std equivalent.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
xai-grok-test-support = { workspace = true }
xai-grok-sampler = { workspace = true }
xai-grok-sampling-types = { path = "../codegen/xai-grok-sampling-types" }

# Keep most ordinary contracts in one binary. The SDK runtime has a large
# upstream dependency closure, so a shared harness avoids linking that closure
# once per source file. Process-sensitive and live checks retain isolation.
[[test]]
name = "sdk_contracts"
path = "tests/sdk_contracts.rs"

[[test]]
name = "kernel_runtime"
path = "tests/kernel_runtime.rs"

[[test]]
name = "live_provider_protocols"
path = "tests/live_provider_protocols.rs"

[lints]
workspace = true
